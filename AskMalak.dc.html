const AMK = [["Revolut","/revolut","Making credit clear and safe inside one of Europe’s biggest fintech apps","At Revolut I designed lending products end to end: mortgages, credit card repayment, loans and car finance, across several European markets. Regulated, high stakes products, made understandable in a few taps."],["Revolut","/revolut","Making credit clear and safe inside one of Europe’s biggest fintech apps","Credit is where customers are most anxious and regulators most watchful. Terms like APR, LTV and stamp duty must stay exact and still make sense to a first time borrower, in many different markets."],["Revolut","/revolut","Making credit clear and safe inside one of Europe’s biggest fintech apps","Designed lending journeys end to end, pairing precise language with interaction that explains instead of just informing."],["Revolut","/revolut","Making credit clear and safe inside one of Europe’s biggest fintech apps","Lending journeys designed from first question to repayment, built with product, legal and engineering. Metrics are internal, so I share the detail in conversation."],["Revolut","/revolut","Where people are least forgiving","Credit is the part of a banking app where customers are most anxious and regulators are most watchful. The words have to be exact, and still readable by someone doing this for the first time. A mistake costs trust, and in lending trust is the product."],["Revolut","/revolut","Where people are least forgiving","Revolut also runs one app across many markets, each with its own rules, so a pattern that works in one country can be wrong in the next. I design each market as its own case, on top of shared foundations."],["Revolut","/revolut","Making a huge decision feel tangible","A tactile design language. I led a physical, object driven look inspired by wallet style cards, with animated 3D key and house assets, so a mortgage feels like something you can hold, not a spreadsheet."],["Revolut","/revolut","Making a huge decision feel tangible","Offers you can read. Offer building flows with a breathing light and rolling digit reveals that make numbers land clearly. Screens for approval in principle and refinancing, with precise microcopy for APR, LTV, stamp duty and green home discount."],["Revolut","/revolut","Making a huge decision feel tangible","Eligibility explained, not just decided. A downpayment component that shows eligibility depends on both the property and the individual assessment, so a user understands why before they ask."],["Revolut","/revolut","Making a huge decision feel tangible","A shorter way in. A redesigned questionnaire for the Lithuanian market that cut the onboarding flow substantially."],["Revolut","/revolut","Making a huge decision feel tangible","People should see what they will pay, and when, before they agree to anything."],["Revolut","/revolut","Making a huge decision feel tangible","A “no” with a reason is a conversation. A “no” without one is a lost customer."],["Revolut","/revolut","Making a huge decision feel tangible","Exact terms stay exact. Layout, order and animation do the explaining."],["Revolut","/revolut","Making a huge decision feel tangible","Shared components, local rules. Test the edge, not just the average."],["Revolut","/revolut","Making a huge decision feel tangible","“She has a great ability to balance business needs with user problems, which made her a fantastic person to work with.”"],["Revolut","/revolut","Making a huge decision feel tangible","“An incredible designer with strong craft and strategic thinking, who can balance pressure, speed and quality really well.”"],["Revolut","/revolut","Making a huge decision feel tangible","“She’s very good at taking something complex and turning it into a simple, clear experience. She also has strong product thinking and asks the right questions.”"],["Revolut","/revolut","What I bring to your team","Product design in lending is mostly an exercise in judgement: what to say, in what order, and what to leave out. I have spent years working in regulated fintech, across lending, cards and mortgages, and I am equally comfortable in a legal review and in a motion prototype."],["Klivvr","/klivvr","","Klivvr is a BNPL and money app. I designed its lending feature end to end: the application, the way it lives inside the app people already use, and the repayment experience after approval."],["Klivvr","/klivvr","","Research, workshops, flows, UI, testing, developer handoff"],["Klivvr","/klivvr","","Lending is the heaviest thing you can ask of a new user: documents, eligibility, a long form. Dropped into an app with features already in place, it risked overwhelming people or getting lost."],["Klivvr","/klivvr","","Led the design from the analytics up. I found where users disappeared, validated the flow in prototype before committing to UI, and kept every screen quiet, clear and honest about what happens next."],["Klivvr","/klivvr","","A guided application that tells people where they stand at every step, and a lending feature that reads as a natural part of the app. I owned UX for lending, onboarding and financial health through a growth period when transacting customers rose 20% and volume 50% month over month."],["Klivvr","/klivvr","Two problems that fed each other","The application itself. A lending application means documents and a long process. Done badly, it overwhelms people and they leave. The job was to guide users through every requirement efficiently and transparently, and to cut the perceived effort without cutting any of the checks that have to happen."],["Klivvr","/klivvr","Two problems that fed each other","The feature around it. Klivvr already had features people knew. Adding a complex new one risked navigation problems and a worse overall experience. Lending had to feel like a natural extension of the app, using its structure and language, not a separate product bolted on."],["Klivvr","/klivvr","Starting with where people disappeared","Analysed user analytics to find the drop off points and the behaviour patterns behind them."],["Klivvr","/klivvr","Starting with where people disappeared","Audited the existing app end to end to find where the journey let people down."],["Klivvr","/klivvr","Starting with where people disappeared","Brought every team into the room, including on the ground sales representatives, to understand why users disengaged."],["Klivvr","/klivvr","Starting with where people disappeared","They downloaded the app, created an account and never did anything else. The insight that shaped the brief."],["Klivvr","/klivvr","Starting with where people disappeared","That reframed the project. Lending could not just be a good form. It had to be the thing that gave a new user a reason to come back, so the way into it mattered as much as the application."],["Klivvr","/klivvr","Listening across the company, borrowing the best","A cross functional workshop. Marketing, sales, customer service and engineering each sent a representative to share what they see from where they stand. Customer service and sales gave the most insightful feedback, because they work first hand with users every day."],["Klivvr","/klivvr","Listening across the company, borrowing the best","Benchmarked local apps (Telda, Boubyan) and global ones (Revolut, Nubank, Chime, Cash App, KakaoBank, Grab) for onboarding, lending flows and how each one places lending in navigation."],["Klivvr","/klivvr","Listening across the company, borrowing the best","The pattern was clear. The best products gave lending a clear home but let the rest of the app lead people to it."],["Klivvr","/klivvr","Listening across the company, borrowing the best","I prototyped the entire journey across three iterations before polishing a single screen, with a stakeholder review between the first and second. Each round was put in front of users and stakeholders, and every change was judged against one test: does this make the next step clearer?"],["Klivvr","/klivvr","Two rounds, two different questions","Flow first. I validated the structure before touching the interface. Four of five participants knew exactly what to do next, which gave the team the confidence to commit to the approach."],["Klivvr","/klivvr","Two rounds, two different questions","Then the surface. With the flow proven, I refined the interface for clarity, so every screen asks for one thing and says what comes next."],["Klivvr","/klivvr","Built the way it was designed","I closed the loop with engineering in a final walkthrough of the completed designs, so what shipped stayed true to the intent behind it."],["Klivvr","/klivvr","Built the way it was designed","Home with a stepper The next step is always in view."],["Klivvr","/klivvr","Built the way it was designed","Financial products in one place Beside the products people already know."],["Klivvr","/klivvr","Built the way it was designed","The value in three lines A clear promise before any questions."],["Klivvr","/klivvr","Built the way it was designed","One question per screen, fields merged where they belong together. The hard part was legal copy: accurate, but dense and easy to misread. I walked legal through the reasoning behind each screen, and we reached a middle ground that stays compliant while clarity and low cognitive load remain the goal."],["Klivvr","/klivvr","Built the way it was designed","Payments Itemised by merchant, with late warnings that say what to do."],["Klivvr","/klivvr","Built the way it was designed","Statements Every fee, line by line, before it is charged."],["Klivvr","/klivvr","Clarity is the conversion strategy","In lending, people do not drop off because the task is hard. They drop off because they cannot see how hard it is going to be. The work here was making each step small, honest and obviously worth taking: show the promise first, ask one thing at a time, say what happens next, and never let a fee appear without warning."],["Klivvr","/klivvr","Clarity is the conversion strategy","It is the same principle I use everywhere in regulated products. When money is involved, a calm interface is a feature."],["Logpoint","/logpoint","One website for engineers and buyers","Logpoint is a Nordic cybersecurity and SIEM provider. Its website spoke either to customers or to engineers, never both, and said little about its Nordic character. I redesigned its digital platform under one clear brand."],["Logpoint","/logpoint","One website for engineers and buyers","Workshops, personas, flows, brand expression, UI, mini design system"],["Logpoint","/logpoint","One website for engineers and buyers","Security leaders, technical experts, customers"],["Logpoint","/logpoint","One website for engineers and buyers","The site leaned either customer facing or deeply technical, said little about Logpoint’s Nordic character, and did not show why its technology matters for security."],["Logpoint","/logpoint","One website for engineers and buyers","Aligned the team in workshops, built personas and flows, created minimal illustration and a mini design system, and tested with the CTO, Sales Director, Customer Success and customers."],["Logpoint","/logpoint","One website for engineers and buyers","One clear brand and a site that works for customers and technical experts alike, with the Nordic character built into how it looks and feels."],["Logpoint","/logpoint","A site that picked a side","The site leaned either toward customer content or toward technical detail, so the experience felt inconsistent. Logpoint wanted its Nordic culture, a closeness to nature and an inclusive spirit, to come through, but without losing the credibility a security buyer expects. The site also failed to show how advanced the technology is, and why it matters for cyber security, which called for evidence led pages and stronger imagery."],["Logpoint","/logpoint","A site that picked a side","The brief was to align the brand, the culture and the business goals in a way that worked for every audience."],["Logpoint","/logpoint","A site that picked a side","The full page, before and after. Scroll either one and both move together."],["Logpoint","/logpoint","Workshops, personas and flows","I started with research into Nordic culture, Logpoint’s values and how it wanted nature to appear. Collaborative design thinking workshops with the Logpoint team created a shared vision and shared goals. I then built personas and user flows from the research, so the team could see the site through the eyes of a CISO, an analyst and a prospective customer."],["Logpoint","/logpoint","Friendly and secure at the same time","To serve a diverse audience while keeping the focus on the product, I chose minimal illustrations with no cultural emphasis. They bring warmth and a nature link, and they imply safety and trust, which is the main message. I sketched diverse characters to reinforce inclusivity and used the illustrations across the site for consistency."],["Logpoint","/logpoint","Friendly and secure at the same time","Friendly, inclusive and unmistakably about security. Built as a set so any page can draw from it."],["Logpoint","/logpoint","Consistency you can build on","A compact design system defined the colour palette, typography, iconography and UI components. It kept the redesign consistent and fast, and it carried the Nordic character into every part of the brand."],["Logpoint","/logpoint","Consistency you can build on","Type, colour and components, defined once and reused across every page."],["Logpoint","/logpoint","Motion with a serious tone","Interactive elements and subtle animation added engagement without undermining the credibility a security brand needs. Dynamic dark and light contrasts served the different needs of different audiences on the same site."],["Logpoint","/logpoint","Motion with a serious tone","Data sources on the left, the platform in the middle, outcomes on the right. A complex architecture in one picture."],["Logpoint","/logpoint","Motion with a serious tone","Feedback came from the CTO, the Sales Director, Customer Success and customers. It changed the direction in clear ways."],["Logpoint","/logpoint","Motion with a serious tone","A redesigned website with a user friendly interface, a cohesive brand, engaging illustration and UI examples showing how the new identity applies to real pages. One clear brand now speaks to customers and technical experts alike, and the Nordic character is part of how the product feels."],["Logpoint","/logpoint","Motion with a serious tone","More pages, screens and visuals from the project. Swipe, scroll sideways or use the arrows."],["Jane Plan","/janeplan","Taking the stress out of checkout for a meal plan subscription","Jane Plan makes healthy eating and weight loss simple with convenient meal plans. I refreshed Jane Plan's marketing pages and subscription journey, leading the redesign of basket and checkout to make purchasing simpler and more reassuring."],["Jane Plan","/janeplan","Taking the stress out of checkout for a meal plan subscription","Competitor research, user flows, wireframes, high fidelity UI, developer collaboration"],["Jane Plan","/janeplan","Taking the stress out of checkout for a meal plan subscription","A confusing, overwhelming checkout caused high drop off, especially on mobile, and left the business short of sales and email data."],["Jane Plan","/janeplan","Taking the stress out of checkout for a meal plan subscription","Researched dozens of competitors, mapped flows around four customer scenarios, starting from the client's brief and their checkout data by step and device, designed high fidelity UI and worked closely with developers."],["Jane Plan","/janeplan","Taking the stress out of checkout for a meal plan subscription","A calmer, more reassuring checkout and subscription flow, designed to be measured by drop off and conversion."],["Jane Plan","/janeplan","A checkout that made people give up","For people new to Jane Plan, checkout was confusing and overwhelming. Data showed high drop off at specific steps, especially on mobile. Fewer people completed their order, which cost the business sales and left it without the email data it needed to follow up."],["Jane Plan","/janeplan","A checkout that made people give up","Same business, calmer story. Scroll either page and both move together."],["Jane Plan","/janeplan","A checkout that made people give up","A checkout that maximises conversion and lowers drop off."],["Jane Plan","/janeplan","A checkout that made people give up","A consistent brand experience, on mobile as much as desktop."],["Jane Plan","/janeplan","A checkout that made people give up","Motivating purchase information, secure payment cues and a simpler delivery step."],["Jane Plan","/janeplan","Dozens of competitors, one clear pattern","This was a heavy UX process. I researched dozens of competitors and e-commerce best practices, and combined them with user testing, to remove the complexity from starting a new meal subscription."],["Jane Plan","/janeplan","Dozens of competitors, one clear pattern","Home, plan, menu and checkout screens from the market, lined up side by side to see where they agree."],["Jane Plan","/janeplan","Dozens of competitors, one clear pattern","“I need a meal plan that fits my busy life and actually tastes good. Something I can stick to without feeling like I am missing out on real food.”"],["Jane Plan","/janeplan","Dozens of competitors, one clear pattern","Goal oriented and health conscious, Sarah is open to new approaches to improve her wellbeing. She is comfortable online and mostly shops on her laptop during work hours. She wants a user friendly site with nutritious plans, customisable options and clear information on pricing, ingredients and delivery, and meal planning that fits seamlessly into her routine."],["Jane Plan","/janeplan","Dozens of competitors, one clear pattern","A healthier lifestyle and weight loss while managing a demanding job and family. She wants more energy and the confidence of fitting into her favourite clothes. The challenge is a sustainable eating plan that fits her schedule and still tastes good."],["Jane Plan","/janeplan","Dozens of competitors, one clear pattern","A busy schedule means little time to think. Each step asks for one thing."],["Jane Plan","/janeplan","Dozens of competitors, one clear pattern","Variety matters, but too much of it stalls people. Popular dishes come pre picked, changeable at any time."],["Jane Plan","/janeplan","Dozens of competitors, one clear pattern","Price, guarantee and what is included stay visible exactly where the card comes out."],["Jane Plan","/janeplan","Designing for who is actually checking out","I mapped step by step user flows, then wireframed the key screens as a blueprint for an intuitive, streamlined experience. I designed around four scenarios, starting from the client's brief, their checkout data and their knowledge of who subscribes and the issues customers ran into, because a returning customer with an active plan needs something very different from a first time buyer."],["Jane Plan","/janeplan","Designing for who is actually checking out","From first visit to confirmed order. The dot walks the happy path."],["Jane Plan","/janeplan","Designing for who is actually checking out","Simplified for client privacy. Square boxes are screens, diamonds are decisions."],["Jane Plan","/janeplan","Designing for who is actually checking out","Each one is designed to do one job well. Pick a scenario."],["Jane Plan","/janeplan","Brand colour, typography and components, refined","With flows and personas settled I moved to high fidelity design: an update to the brand colours, a refinement of the type and components, and a UI that feels empathetic and consistent with the Jane Plan brand."],["Jane Plan","/janeplan","Brand colour, typography and components, refined","The real screens, scrollable. Switch step to see the thinking behind it."],["Jane Plan","/janeplan","Brand colour, typography and components, refined","Three moments that carry the conversion. Built from the design, live."],["Jane Plan","/janeplan","Brand colour, typography and components, refined","Add meals, use the stepper, or hit Autofill. Watch the count."],["Jane Plan","/janeplan","Brand colour, typography and components, refined","Most drop off happened on small screens, so the same flow was designed for thumbs from the start."],["Jane Plan","/janeplan","Brand colour, typography and components, refined","On mobile the summary folds into a header row, so the form comes first."],["Jane Plan","/janeplan","Brand colour, typography and components, refined","The five step progress shrinks to numbers and stays pinned."],["Jane Plan","/janeplan","Brand colour, typography and components, refined","The staircase becomes a stack, still rising to the best value plan."],["Jane Plan","/janeplan","Brand colour, typography and components, refined","The BMI and calorie result turns a form into a moment of progress, then points to the plan."],["Jane Plan","/janeplan","A palette that tastes like the brand","I updated the brand colours into a named palette, then refined the type and components so every screen speaks the same language: plan cards, meal cards, steppers, summaries, discount and save for later."],["Jane Plan","/janeplan","A palette that tastes like the brand","Named after food, used with intent. Greens carry action, warm yellows and oranges carry the price steps, raspberry carries the script and urgency."],["Jane Plan","/janeplan","A palette that tastes like the brand","The pieces that repeat across plan, menu and checkout."],["Jane Plan","/janeplan","Closing the gap between design and build","I shared Figma files, stayed active in Slack and kept an open dialogue with engineering. That helped us solve technical constraints creatively and ship a design that worked inside the existing system."],["Yarda","/yarda","","Yarda · Consumer subscription · Brand, UX, UI"],["Yarda","/yarda","Turning a long lawn survey into a funnel people finish","Yarda is an Australian lawn care start up that builds a personalised nutrient plan from your address, lawn size, weather, soil and grass type. I redesigned the brand and the funnel to improve retention."],["Yarda","/yarda","Turning a long lawn survey into a funnel people finish","Roadmap, UX audit, flows, wireframes, UI, brand, developer handoff"],["Yarda","/yarda","Turning a long lawn survey into a funnel people finish","A long, complex survey caused drop off. There was no dashboard, and the brand did not explain what made Yarda different."],["Yarda","/yarda","Turning a long lawn survey into a funnel people finish","Set a roadmap, studied competitors, designed flows and wireframes with the client, refreshed the brand and built the UI with developers."],["Yarda","/yarda","Turning a long lawn survey into a funnel people finish","A four step funnel with streamlined questions, a clear product page and a dashboard, inside a warmer, more cohesive identity."],["Yarda","/yarda","Too much asked, too little shown","The experience lacked personalisation and ease. A multi step survey was complex and overwhelming, so many people dropped off. There was no dashboard to track progress or find resources, and the brand and site did not explain what made Yarda special."],["Yarda","/yarda","Too much asked, too little shown","Many questions, no sense of progress, and no reward for finishing."],["Yarda","/yarda","Too much asked, too little shown","With no dashboard, there was no place to track a lawn or find help after buying."],["Yarda","/yarda","Too much asked, too little shown","The site did not explain what made a tailored plan different from a bottle off the shelf."],["Yarda","/yarda","Aligning on the plan before the screens","I began with a project roadmap so the client could see the process and what we were aiming for. Then I audited the live site and competitors, used user feedback and industry best practice to find the pain points, and turned them into opportunities."],["Yarda","/yarda","Aligning on the plan before the screens","A written review of the existing site, shared at kick off so everyone started from the same facts."],["Yarda","/yarda","Aligning on the plan before the screens","People enter their address and the plan starts to feel personal."],["Yarda","/yarda","Aligning on the plan before the screens","A simpler, more intuitive series about their lawn."],["Yarda","/yarda","Aligning on the plan before the screens","Customised nutrient subscription plans, presented clearly."],["Yarda","/yarda","Aligning on the plan before the screens","One hub to manage the subscription and track progress."],["Yarda","/yarda","Choosing the path with the client","Research became user flows, and flows became wireframes showing the logical sequence of screens and interactions. I worked with the client to select the flow and wireframes that best fitted the business."],["Yarda","/yarda","Choosing the path with the client","From the homepage to the lawn analysis. The dot walks the happy path."],["Yarda","/yarda","Choosing the path with the client","Simplified for client privacy. Green boxes are screens, slanted boxes are inputs, diamonds are decisions."],["Yarda","/yarda","Choosing the path with the client","A single address field and a Start button replace a banner with competing messages. The plan begins the moment someone types."],["Yarda","/yarda","Choosing the path with the client","Free delivery, easy cancel or pause and a money back guarantee sit in one green band, answering the doubts before they are asked."],["Yarda","/yarda","Choosing the path with the client","A bold headline, plain body copy and generous space let the product photography do the talking."],["Yarda","/yarda","Choosing the path with the client","The survey became a short guided conversation. A progress rail shows where people are and what is left, each screen asks one thing, and the reward, a personal lawn analysis, arrives at the end."],["Yarda","/yarda","A hub people come back to","The dashboard was new. It turns a one off purchase into an ongoing relationship: a place to see the lawn, understand what it needs and manage the subscription."],["Yarda","/yarda","A hub people come back to","Two views, both scrollable. Switch to see the thinking behind each."],["Yarda","/yarda","A hub people come back to","A small piece of the dashboard, live. Set each nutrient and watch the plan respond."],["Yarda","/yarda","Designed for the garden, not just the desk","Most people check a lawn plan outside, on a phone. The homepage, questionnaire and dashboard were designed in parallel for mobile, with the same hierarchy, large touch targets and cards that stack cleanly."],["Yarda","/yarda","A warmer, more confident identity","I harmonised existing and new brand elements, using graphics that echo a lawn, such as diagonal lines and dot grids, across imagery and banners. A palette led by fresh green, deep teal and a vibrant coral call to action makes the whole experience inviting and cohesive."],["Yarda","/yarda","A warmer, more confident identity","Green for growth, deep teal for trust, coral for the one thing to do next."],["Yarda","/yarda","A warmer, more confident identity","Ingredients page Nutrients explained as friendly tiles, so the science never feels like a warning label."],["Yarda","/yarda","A warmer, more confident identity","Our mission The brand story told with real people, warm photography and the same calm layout."],["Yarda","/yarda","A tight plan, kept in step with the build","I worked closely with the development team to understand constraints, solve feasibility questions and update the UI and Figma files on request. Three homepage modules were designed, reviewed and signed off in the opening days, then built in stages, with a design review after every build."],["Yarda","/yarda","A tight plan, kept in step with the build","Four weeks, three lanes. Hover a card to lift it."],["Yarda","/yarda","A tight plan, kept in step with the build","Review and testing Design review of each build"],["Yarda","/yarda","A tight plan, kept in step with the build","A redesigned Yarda funnel with streamlined questionnaires, an effective product page and an intuitive dashboard, wrapped in a cohesive visual identity and built with developers for a successful, inviting experience."],["Heal","/heal","A way for people the system could not diagnose to explore alternative treatment","Heal is a digital platform for people frustrated by traditional medicine. It compares treatments on cost and efficacy and includes a booking system. I founded and designed it after my own experience of unsatisfactory support for an unknown illness."],["Heal","/heal","A way for people the system could not diagnose to explore alternative treatment","Had an illness their doctor could not identify"],["Heal","/heal","A way for people the system could not diagnose to explore alternative treatment","Surveys, interviews, journey, ideation, MVP, storyboards, flows"],["Heal","/heal","A way for people the system could not diagnose to explore alternative treatment","People whose doctors cannot explain their symptoms want other options, but are overwhelmed and worried about cost, trust and whether anything will work."],["Heal","/heal","A way for people the system could not diagnose to explore alternative treatment","Surveyed 88 people, interviewed people with chronic illness, built an MVP with a chatbot, medical history and doctor assignment, then tested and iterated."],["Heal","/heal","A way for people the system could not diagnose to explore alternative treatment","In testing, 31% valued the simpler healing process, 16% the clinic search and 13% the reminders. It has not launched yet and is still being refined."],["Heal","/heal","A way for people the system could not diagnose to explore alternative treatment","had an illness their doctor could not identify"],["Heal","/heal","A way for people the system could not diagnose to explore alternative treatment","worried alternative treatments would not be effective"],["Heal","/heal","Overwhelmed, and worried about money","Someone whose doctors cannot explain their symptoms wants to explore other options. They are overwhelmed by choices, willing to try several approaches, and anxious about spending money on the wrong one. They need help finding the treatment that fits their case, at a price they can justify."],["Heal","/heal","Listening before building","I surveyed 88 people and interviewed people living with chronic or unexplained illness. Concerns clustered around effectiveness (43%), cost (29%) and trust (11%), and 51% reported an illness their doctors had not identified. The message was consistent: people need accessible, trustworthy options."],["Heal","/heal","Listening before building","I put every answer on a board and grouped it by theme: work and lifestyle, experience and opinions, possible problems, relationship with technology, and the booking process people already know."],["Heal","/heal","Listening before building","The affinity map, rebuilt so you can explore it by theme."],["Heal","/heal","Hana, who has tried everything else","The research pointed to one person: a capable, motivated professional whose health is holding her back, who believes the best care combines eastern and western medicine, and who needs it to fit around a working week."],["Heal","/heal","Hana, who has tried everything else","A working mother of two. Her declining health means she can no longer manage on site work, so she now works from home. She is determined to stay productive and keeps stress down with yoga and meditation."],["Heal","/heal","Hana, who has tried everything else","“I believe in combining both alternative medicine and traditional medicine for it to be truly holistic.”"],["Heal","/heal","From a Facebook ad to feeling understood","I mapped five stages, Entice, Enter, Engage, Exist and Extend, against what the customer does, how they feel, the touch point, and what the team does in front of and behind the scenes. The one thing every stage protects is trust: nothing asks for money before a person feels heard."],["Heal","/heal","Two exercises, many voices","I ran brainwriting and Crazy 8’s with three participants, so the ideas did not all come from me. The strongest themes were a doctor matched to each patient, one medical history that travels with them, and honest reviews from people who had been through it."],["Heal","/heal","Two exercises, many voices","Everyone writes as many ideas as possible for ten minutes, each on its own card, without looking at anyone else’s board. Every team member gets an equal chance to have their ideas heard and put into practice."],["Heal","/heal","Two exercises, many voices","A fast sketching exercise: eight distinct ideas in eight minutes, to push past the first idea. The question was how might we help patients choose the best alternative or traditional medicine route for their case?"],["Heal","/heal","What goes in the first release","Every idea went onto a value and effort grid. The quick wins became the MVP: website, chat bot, medical history and doctor assignment, with dashboard, daily check ins, calendar and reviews alongside. Forums, booking and doctor profiles wait for phase two."],["Heal","/heal","What goes in the first release","The storyboard follows Hana from a Facebook ad to a program she trusts. Each step has what she sees, what she says, and how she feels, so every screen has a job to do."],["Heal","/heal","What goes in the first release","Sees a Heal ad in a Facebook group while scrolling."],["Heal","/heal","What goes in the first release","The button leads to the website, which gives an overview of Heal."],["Heal","/heal","What goes in the first release","A plain explanation of what the program offers."],["Heal","/heal","What goes in the first release","Learns about the doctors who will support the journey."],["Heal","/heal","What goes in the first release","Fills in a questionnaire by chatting with a smart bot."],["Heal","/heal","What goes in the first release","The bot confirms the plan will be ready within a week and moves to payment."],["Heal","/heal","What goes in the first release","A week later an email arrives with a link to the app where the program is available."],["Heal","/heal","What goes in the first release","The program lives in the app, with check ins and the specialists in one place."],["Heal","/heal","What goes in the first release","Two flows. The website turns curiosity into a paid program through a single smart chat. The app then holds the program: a dashboard, medical history, tests, booking and daily check ins."],["Heal","/heal","Heal, built around those concerns","A user friendly website and a chatbot that guides people through their options."],["Heal","/heal","Heal, built around those concerns","Medical history tracking and a doctor assignment system."],["Heal","/heal","Heal, built around those concerns","Progress tracking and a peer review system, so people see what worked for others like them."],["Heal","/heal","Heal, built around those concerns","31% valued the simplified holistic healing process."],["Heal","/heal","Heal, built around those concerns","Users also asked for video call appointments, which is planned for a future version."],["Goodground","/goodground","","Goodground · Personal project · Product, UX, UI"],["Goodground","/goodground","Build your financial foundations, with no catch","Goodground is a free planning tool for people living in the UAE. It helps you see where you stand, set a goal like buying a home, and get an honest plan to reach it. No sign up, nothing stored, nothing to sell you. I researched, designed and launched it myself."],["Goodground","/goodground","Build your financial foundations, with no catch","Market research, brief, brand, UX, UI, copy, launch"],["Goodground","/goodground","Build your financial foundations, with no catch","Most money tools in the UAE exist to collect your number for a broker or a bank."],["Goodground","/goodground","Build your financial foundations, with no catch","A free, private planner that tells you what you should do, not only what you can."],["Goodground","/goodground","Build your financial foundations, with no catch","Live site with planning chats, learning pages and a downloadable plan."],["Goodground","/goodground","Tools built to sell, not to help","Most money tools in the UAE exist to collect your number for a broker or a bank. They show the most a lender will give you, not what you can comfortably live with. They hide real costs, like the 4% Land Department fee, and the rules expats face. And people avoid money decisions altogether because they feel judged or confused."],["Goodground","/goodground","Busy, capable, a little anxious","The main audience is salaried UAE residents, mostly expats, aged roughly 25 to 45, who rent today and are thinking about their next milestone, most often a first home. They want a clear answer, not a lecture. A second audience is the people reading this as my work: employers, clients and hiring managers, so every line of copy had to read as credible and expert."],["Goodground","/goodground","Busy, capable, a little anxious","I ran a research sweep across six angles: mortgage tools in the UK, Ireland and Europe, tools in the US and Australia, financial health and budgeting products, the UAE and wider MENA market, real borrower pain points, and what makes a free finance tool spread. The gap was clear. Plenty of tools answer how much you can borrow. Almost none are independent, private and honest about what you should."],["Goodground","/goodground","Busy, capable, a little anxious","No sign up. Your numbers never leave your device."],["Goodground","/goodground","Busy, capable, a little anxious","What you should do, not just what you can do."],["Goodground","/goodground","Warm, plain and slightly under claiming","The voice is a design decision as much as the layout. Short sentences and everyday words. It speaks to you, never shames, and is specific to life in the UAE. It never invents a statistic, a testimonial or a partnership, and it never recommends a lender or product. It gives guidance, not financial advice."],["Goodground","/goodground","Warm, plain and slightly under claiming","The home page asks one question first, then opens the plan for that goal. Try the four goals."],["Goodground","/goodground","Warm, plain and slightly under claiming","Light mode, as it runs on goodground.cc. Pick a goal to see what each plan covers."],["Goodground","/goodground","Warm, plain and slightly under claiming","The planner is a chat. Seven quick questions, each with a short line on why it matters, and a constant reminder that nothing is saved. Watch a full session play through."],["Goodground","/goodground","Warm, plain and slightly under claiming","A looping walk through the real planner, in light mode: seven questions, then a plan you can adjust. The planner runs on your device and saves nothing."],["Goodground","/goodground","Teach it, then let people act on it","A plan is only useful if people understand why it says what it says. The research showed the same thing in different words: people do not trust tools that ask for numbers and give nothing back. So I designed a learning side next to the planner, and treated it as a product with its own job: build enough understanding that the plan feels earned, not handed down."],["Goodground","/goodground","Teach it, then let people act on it","The hard part was not the content, it was the experience around it. Money content is easy to make long, dense and preachy. The design had to keep it light, scannable and honest, and keep the same promise as the rest of the site: no sign up, nothing saved."],["Goodground","/goodground","Teach it, then let people act on it","The learning home and a lesson, as they look on the live site. One clear choice per course, then a calm reading page."],["Goodground","/goodground","Make learning part of the product, not a library","A planner tells people what to do. It cannot make them trust it. I added four short courses (money basics, saving, debt, investing) so anyone can understand the why behind a plan, and linked them from the home page and the main navigation so the next step is always one tap away."],["Goodground","/goodground","Five lessons, three to four minutes each","People who worry about money rarely have an hour. A fixed, small shape makes the whole course feel finishable before they start, and every lesson ends with one thing to do today so reading turns into action."],["Goodground","/goodground","A reading layout that always shows where you are","A sticky lesson list with read times sits beside a single comfortable text column. A progress bar shows lessons read. It only lasts while the page is open, which matches the privacy promise and means no account is ever needed."],["Goodground","/goodground","Earn trust in the content itself","Every lesson has the same blocks: a plain opening line, the UAE specifics, a myth worth busting, and a try this today action. Sources and the date checked sit at the bottom, because a finance page without sources is just an opinion."],["Goodground","/goodground","One system, from question to understanding","The courses sit beside the planner in the main navigation and on the home page, and the lesson pages keep a way back into planning, so learning and planning feed each other. What I would measure next: how many people open a lesson after a plan, how many finish a course in one sitting, and whether those people go on to download their plan."],["Goodground","/goodground","Free tools that run on your own device","A home page that leads with a goal, in light or dark mode to match your system."],["Goodground","/goodground","Free tools that run on your own device","Planning chats that run through to a finished plan: a start chat that asks your goal, then buy a home, build savings, clear debt and grow money."],["Goodground","/goodground","Free tools that run on your own device","Download your plan as a PDF, with nothing stored on a server."],["Goodground","/goodground","Free tools that run on your own device","Short learning pages, a blog, a story page and a plain language promise page."],["Goodground","/goodground","Free tools that run on your own device","Goodground is live. The designs are desktop first, so the next step is a proper mobile version of every page. More tools are planned: build my savings, clear my debt, grow my money and a full money health check."],["dopay","/dopay","A payroll website that sounds like the people behind it","dopay lets businesses pay salaries instantly, 24/7, with no cash and no bank delays. I redesigned its website end to end: the strategy, the page system, the design system, the sign up funnel and the self onboarding flow."],["dopay","/dopay","A payroll website that sounds like the people behind it","A generic payroll site that hid dopay’s real edge, a hands on team, and sent visitors into a sign up that did not match the real process."],["dopay","/dopay","A payroll website that sounds like the people behind it","Set the strategy, rebuilt the page structure, designed every key page and the self onboarding flow, and built the design system underneath."],["dopay","/dopay","A payroll website that sounds like the people behind it","Every page designed and handed to development in phases, so build ran in parallel with design."],["dopay","/dopay","A payroll website that sounds like the people behind it","Before and after the redesign. The old site's analytics tags were not set up properly, so the before numbers were partial."],["dopay","/dopay","A payroll website that sounds like the people behind it","“I was working with Malak on revamping the dopay website. She brought a great balance of creativity, structure, and user centric thinking to the project. From the very beginning, she took the time to deeply understand our brand, our audience, competitors and the complexity of our product, then translated that into a clean, intuitive, and modern design."],["dopay","/dopay","A payroll website that sounds like the people behind it","Her ability to combine UX strategy elevated the project far beyond our expectations. She was organized, punctual, proactive, collaborative, and always open to feedback. Thanks to her efforts, we will be having a website that not only reflects dopay’s brand identity but also delivers a seamless experience to our users."],["dopay","/dopay","A payroll website that sounds like the people behind it","I would highly recommend Malak to any team looking for a talented, reliable, and thoughtful Senior product designer. She is truly a pleasure to work with, keep up the great work Malak!”"],["dopay","/dopay","A product with a human edge, hidden behind a generic site","dopay gives employees instant access to their earned wages and gives businesses a simple way to pay salaries without cash risk or bank delays. What makes it different is the people: a dedicated onboarding team and real support."],["dopay","/dopay","A product with a human edge, hidden behind a generic site","The old site said none of that. It read like any payroll fintech, and a visitor could not tell why they should leave cash, or why dopay beats a bank."],["dopay","/dopay","A product with a human edge, hidden behind a generic site","No answer to the first question. The homepage never explained why switch from cash, or why dopay over a bank or another fintech."],["dopay","/dopay","A product with a human edge, hidden behind a generic site","A call to action that over promised. It suggested an instant sign up. The real process needs a check, paperwork and onboarding."],["dopay","/dopay","A product with a human edge, hidden behind a generic site","A form with no brand and no explanation. A generic HubSpot form, with a button that did not say what you were signing up for."],["dopay","/dopay","A product with a human edge, hidden behind a generic site","Pages that spoke to everyone. The SME, enterprise and employee pages felt the same, with no industry or person in focus."],["dopay","/dopay","A product with a human edge, hidden behind a generic site","Selling points buried. Crucial information sat deep in the page."],["dopay","/dopay","Two audiences, one promise","Payers are business owners, HR and finance teams. They sign up, so they need to see a simpler way to pay, a smooth switch and support that stays. Payees are employees: full time, part time, seasonal, white collar and blue collar. They care about being paid instantly, free withdrawals and knowing where to go for help."],["dopay","/dopay","Two audiences, one promise","A large share of payees are blue collar workers. That set one rule for the whole site: checking a balance, withdrawing money or replacing a card must never feel complicated, so every page uses plain words and one clear next step."],["dopay","/dopay","Two audiences, one promise","How do we build a website that earns trust, drives engagement and shows dopay as a human, modern and secure financial partner?"],["dopay","/dopay","Two audiences, one promise","Proof sits at the top: who trusts dopay, what is secure and how fast you go live."],["dopay","/dopay","Two audiences, one promise","One idea per section, plain language, and the product shown instead of described."],["dopay","/dopay","Two audiences, one promise","Real people and real stories, because pay is personal and trust is human."],["dopay","/dopay","Two audiences, one promise","dopay described itself this way, and I used it as the filter for tone and layout."],["dopay","/dopay","Planned in ten weeks, delivered page by page","I worked in phases and handed off in batches, so developers could start on approved pages while I designed the next ones. That kept the whole project moving instead of waiting for one big handoff."],["dopay","/dopay","Planned in ten weeks, delivered page by page","Weeks 1 to 2. Planning and data: goals, audience, an audit of the current site."],["dopay","/dopay","Planned in ten weeks, delivered page by page","Weeks 3 to 4. Visual direction and the homepage."],["dopay","/dopay","Planned in ten weeks, delivered page by page","Weeks 7 to 8. Knowledge hub, blog and marketplace."],["dopay","/dopay","Planned in ten weeks, delivered page by page","Design reviews ran on fixed dates with the marketing director, the COO and the development team, so approvals never became a surprise at the end."],["dopay","/dopay","Planned in ten weeks, delivered page by page","The project plan Objectives, page list, timeline, review dates and who approves what, all kept in one living document the whole team could open."],["dopay","/dopay","Answer the first question on the first screen","The headline is the strategy in one line: Payroll that works for real life. Under it, a promise in plain words, two clear actions, and the product itself, a balance and a card, so a payer sees what their team receives."],["dopay","/dopay","Answer the first question on the first screen","Trust before anything else. A band of well known client logos sits right under the first screen."],["dopay","/dopay","Answer the first question on the first screen","Six reasons, six short lines. 24/7 access, zero cost, instant setup, real time control, security and live in 24 hours. Each one reads in a glance."],["dopay","/dopay","Answer the first question on the first screen","Show how it works. The real payments screen with a clear Get Started and Watch Demo, so a visitor sees how little changes in their workflow."],["dopay","/dopay","Answer the first question on the first screen","People near the end. Stories from real users, then a personal walkthrough offer for anyone who wants a human first."],["dopay","/dopay","Answer the first question on the first screen","The homepage, scroll it yourself The whole page, top to footer, as designed. Scroll inside the window, switch t const amFlow = (t, ctx) => {

const amSend = (ctx, v) => {

const AM_FACTS = [

  'Roles: Product Designer, Credit at Revolut (mortgages and lending in Ireland, Lithuania and the UK); Founder of Mpavida, a product design consultancy for fintech, hospitality and SaaS startups; Product Designer at Klivvr (owned UX for lending, onboarding and financial health features); Senior Product Designer and Product Strategist at dopay; Design Lead at Vodafone (led a team of six designers and built the enterprise design system); Designer at Shoreditch Design Studio.',
  'She has shipped 20+ products across 10+ markets. At Klivvr she owned UX for lending, onboarding and financial health features during a growth period when transacting customers rose 20% and transaction volume rose 50% month over month.',
  'How she works: she interrogates a brief before designing. She reads the underlying regulation herself to check whether a stated requirement is truly mandatory or over cautious, and asks whether numbers in a brief are fixed or calculated. If a brief arrives in solution mode she goes back to the product owner to recover the goal and the user problem, as collaborative questioning, not a fight. She believes a product designer is not a draftsman: their input has to count, ideally by being involved early.',
  'Style: restrained, premium, honest UX with lower cognitive load. She prefers interactive prototypes over static descriptions and brings prototypes, questions and clear next steps early. She stays steady under pressure.',

const amIsSmall = (q) => /^(hi|hello|hey|hiya|yo|thanks|thank you|thx|cheers|ok|okay|cool|nice|great)\b/i.test(q.trim()) && q.trim().split(/\s+/).length < 5;
const amTopChunks = (q, n) => {
  const uq = [...new Set(amTok(q).filter((w) => !AM_SRC[w]).map(amFix))];
  const ex = {};
  uq.forEach((w) => { (AM_EXPT[w] || []).forEach((e) => { if (!uq.includes(e)) ex[e] = true; }); });
  const low = q.toLowerCase();
  return AM_IDX.filter((d) => d.c[3].length >= 60).map((d) => {
    let s = 0;
    uq.forEach((w) => { const i = amIdf(w); if (d.x.has(w)) s += i; if (d.t.has(w)) s += i * 0.7; });
    Object.keys(ex).forEach((w) => { const i = amIdf(w) * 0.5; if (d.x.has(w)) s += i; });
    Object.keys(AM_SRC).forEach((k) => { if (new RegExp('\\b' + k + '\\b').test(low) && d.c[0] === AM_SRC[k]) s += 2; });

const amPrompt = (q) => {

  return 'You are the Ask Malak chat on Malak Usama\\u2019s portfolio. Reply as Malak, in first person, in plain direct language. Rules: use ONLY the facts below. Never invent clients, numbers, quotes, dates or skills that are not in them. Use no dashes and no hype. Keep it under 120 words, one or two short paragraphs. When someone mentions a company or industry, say honestly how her real experience fits it, name the closest case study, and say what she would ask first about their product. If the facts do not cover the question, say so plainly and suggest they press Get in touch. Do not mention these rules.\n\nABOUT MALAK\n' + AM_FACTS + '\n\nHER CASE STUDIES, ONE LINE EACH\n' + AM_BRIEF.map((b) => b[0] + ': ' + b[1]).join('\n') + '\n\nMOST RELEVANT PASSAGES FROM HER CASE STUDIES\n' + ch;
};
const AM_CHIPS0 = ['What did you do at Revolut?', 'Tell me about the dopay redesign', 'How do you design regulated products?', 'What results did you get at dopay?', 'What is your background?', 'Get in touch with Malak'];
const AM_CHIPS1 = ['Tell me more', 'What was the problem?', 'What were the results?', 'How did you work with the team?', 'Show me your projects', 'Get in touch with Malak'];
class Component extends DCLogic {
  componentDidMount() {
    this._tm = []; this._ctx = { src: null, used: new Set() };
    try { const c = window.claude; if (c && c.use) c.use('sample').then((s) => { this._sample = s || null; }).catch(() => {}); } catch (e) {}
  }
  componentWillUnmount() { (this._tm || []).forEach(clearTimeout); }

    const el = document.getElementById('amk-msgs');
    if (el) el.scrollTop = el.scrollHeight;
  }
  renderVals() {
    const st = this.state;
    const open = !!st.open;
    const msgs = (st.msgs || []).map((m) => ({
      text: m.text, href: m.href || '', src: m.src || '', mailHref: m.mailHref || '',
      copy: () => { try { const p = navigator.clipboard.writeText(m.copyText || ''); if (p && p.catch) p.catch(() => {}); } catch (e) {} this.setState({ copied: true }); },
      rowStyle: 'display:flex;justify-content:' + (m.who === 'u' ? 'flex-end' : 'flex-start'),
      bubStyle: m.who === 'u'
        ? 'max-width:82%;padding:11px 15px;border-radius:18px 18px 6px 18px;background:#f6f1e4;color:#0b0b0e;font-size:14.5px;line-height:1.5'

}
